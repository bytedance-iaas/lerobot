// To generate a classes for transport part (services_pb2.py and services_pb2_grpc.py) use the following command:
//
// python -m grpc_tools.protoc -I src --python_out=src --grpc_python_out=src src/lerobot/transport/services.proto
//
// The command should be launched from the root of the project.

syntax = "proto3";

package transport;

// LearnerService: the Actor calls this to push transitions.
// The Learner implements this service.
service LearnerService {
  // Actor -> Learner to store transitions
  rpc StreamParameters(Empty) returns (stream Parameters);
  rpc SendTransitions(stream Transition) returns (Empty);
  rpc SendInteractions(stream InteractionMessage) returns (Empty);
  rpc Ready(Empty) returns (Empty);
}

// AsyncInference: from Robot perspective
// Robot send observations to & executes action received from a remote Policy server
service AsyncInference {
  // Robot -> Policy to share observations with a remote inference server
  // Policy -> Robot to share actions predicted for given observations
  rpc SendObservations(stream Observation) returns (Empty);
  rpc GetActions(Empty) returns (Actions);
  rpc SendPolicyInstructions(PolicySetup) returns (Empty);
  rpc Ready(Empty) returns (Empty);
}

// RemoteEnv: the evaluation loop runs where the policy is (e.g. an Ascend NPU host)
// while the simulator runs where the GPU and the GL stack are. The client is a
// gym.vector.VectorEnv proxy, so lerobot_eval's reset/step loop is unchanged.
//
// Payloads are pickled, like the rest of this file. That assumes a trusted network -- the
// simulator host is normally a GPU box in the same cluster. If it is ever published
// through a gateway, the gateway must authenticate every call.
service RemoteEnv {
  rpc Ready(Empty) returns (Empty);
  // Build the envs described by the spec; replies with the suite/task handles and spaces.
  rpc Make(EnvSpec) returns (stream Chunk);
  rpc Reset(EnvCall) returns (stream Chunk);
  rpc Step(EnvCall) returns (stream Chunk);
  rpc Close(Empty) returns (Empty);
}

enum TransferState {
    TRANSFER_UNKNOWN = 0;
    TRANSFER_BEGIN = 1;
    TRANSFER_MIDDLE = 2;
    TRANSFER_END = 3;
}

// Messages
message Transition {
  TransferState transfer_state = 1;
  bytes data = 2;
}

message Parameters {
  TransferState transfer_state = 1;
  bytes data = 2;
}

message InteractionMessage {
  TransferState transfer_state = 1;
  bytes data = 2;
}

// Messages
message Observation {
  // sent by Robot, to remote Policy
  TransferState transfer_state = 1;  // Observations can be streamed exceeding 4MB of size
  bytes data = 2;
}

message Actions {
  // sent by remote Policy, to Robot
  bytes data = 1;
}

message PolicySetup {
  // sent by Robot to remote server, to init Policy
  bytes data = 1;
}

// ---- RemoteEnv messages -------------------------------------------------------------
message EnvSpec {
  // Pickled: the EnvConfig fields plus n_envs / use_async_envs.
  bytes spec = 1;
}

message EnvCall {
  string suite = 1;
  int32 task_id = 2;
  // Pickled: the action batch for Step, the seed/options for Reset.
  bytes payload = 3;
}

message Chunk {
  TransferState transfer_state = 1;
  bytes data = 2;
}

message Empty {}

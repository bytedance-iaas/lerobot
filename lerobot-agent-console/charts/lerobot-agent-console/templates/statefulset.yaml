{{- if not .Values.auth.existingSecret }}
{{- fail "auth.existingSecret is empty. This console gives shell access to a GPU node, so it must not start without credentials — and the chart will not take them through values, because Helm keeps values verbatim in the release history where `helm get values` can read them back, on every past revision.\n\nCreate the Secret first (the VKE console has a 密钥 page — no shell needed):\n  kubectl create secret generic lerobot-console-auth -n <ns> --from-literal=username=<user> --from-literal=password=<password>\n\nThen set auth.existingSecret to its name. It must be in the SAME namespace as the release. If your Secret uses different key names, set auth.usernameKey / auth.passwordKey instead of rebuilding it." }}
{{- end }}
{{/* The console is STATEFUL: each pod owns a HERMES_HOME disk (/opt/data) holding the Ark key,
     chat sessions, and the installed skills. A StatefulSet models that directly — every replica
     gets its own PVC from volumeClaimTemplates, so scaling gives N independent disks with no
     shared-writer risk. k8s NEVER deletes those PVCs; `helm uninstall` leaves them behind on
     purpose, and they must be removed by hand. */}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "console.name" . }}
  labels: {{- include "console.selectorLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "console.name" . }}
  replicas: 1
  {{/* Consoles are independent (own disk each), so don't gate pod N on pod N-1 being Ready. */}}
  podManagementPolicy: Parallel
  updateStrategy: { type: RollingUpdate }
  selector:
    matchLabels: {{- include "console.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "console.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: console
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required — the chart does not pin one, because the pipeline tags every build with its commit sha and the chart would then need republishing for each. Pass --set image.tag=<sha>, or set it in the values box. List available tags with: oras repo tags iaas-us-cn-beijing.cr.volces.com/physicalai/lerobot-agent-console" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.capabilities }}
          securityContext:
            capabilities:
              add: {{- toYaml . | nindent 16 }}
          {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            {{- range .Values.env }}
            - { name: {{ .name }}, value: {{ .value | quote }} }
            {{- end }}
            {{/* Single-user HTTP Basic login. There is no fallback pair: with either var
                 missing the server exits 2 (server.py _require_auth_credentials), and a Secret
                 whose name or key is wrong never gets that far — the pod stays in
                 CreateContainerConfigError. Both are better than a console on a public HTTPS
                 endpoint handing out a root shell to whoever asks. The Secret is NOT created
                 here; see auth.existingSecret in values.yaml for why. */}}
            - name: CONSOLE_USER
              valueFrom:
                secretKeyRef: { name: {{ .Values.auth.existingSecret }}, key: {{ .Values.auth.usernameKey }} }
            - name: CONSOLE_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.auth.existingSecret }}, key: {{ .Values.auth.passwordKey }} }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8080, scheme: HTTP }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080, scheme: HTTP }
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - { name: hermes-home, mountPath: /opt/data }
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        {{/* /dev/shm is per-pod scratch, not state — an emptyDir, never a claim template.
             tmpfs counts against the memory limit, but only for bytes actually used. */}}
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: {{ .Values.dshmSize }} }
  volumeClaimTemplates:
    - metadata:
        name: hermes-home        {{/* -> hermes-home-<name>-<n> */}}
        labels: {{- include "console.selectorLabels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}

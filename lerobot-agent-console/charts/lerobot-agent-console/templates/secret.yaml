{{/* Console basic-auth credentials.

     Owned by the chart on purpose: the install path is the VKE console's Helm page, which offers
     no shell, so "create this Secret first" would make the chart uninstallable there. The values
     go in as plain YAML and land here, which at least keeps them out of the StatefulSet's pod
     spec (visible to anyone who can read Deployments).

     No auto-generated random password. Without kubectl the operator's only way to read one back
     is the console's Secret viewer, and a password nobody knows is indistinguishable from a
     broken deploy. Failing loudly at install time is kinder. */}}
{{- if not .Values.auth.password }}
{{- fail "auth.password is empty. Set auth.user / auth.password in values.yaml — this console exposes a root shell on a GPU node, so it must not be reachable without credentials." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "console.name" . }}-auth
  labels:
    app: {{ include "console.name" . }}
type: Opaque
stringData:
  user: {{ .Values.auth.user | quote }}
  password: {{ .Values.auth.password | quote }}

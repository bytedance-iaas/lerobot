# Defaults are installable-anywhere, NOT our deployment: no node pin, APIG off, and no
# credentials, so the install fails loudly rather than coming up unauthenticated.
# Set image.tag and auth.existingSecret before deploying (the chart refuses to render without
# either); everything else works as-is on a GPU cluster.

# Resource names come from the RELEASE name. Pinning a literal here — which this chart used to
# do — means every install produces the same names no matter what you call the release, so a
# second copy collides with the first ("invalid ownership metadata") and the chart can only ever
# exist once per namespace. Our own releases are already named for what they deploy
# (lerobot-agent-console, lerobot-agent-console-test), so the rendered names are unchanged.
# ⚠️ The name also determines the PVC (hermes-home-<name>-0) and the pod DNS that multi-node
# training addresses, so renaming an EXISTING release strands its disk and starts on an empty
# one. Pick the release name deliberately; do not rename later.
nameOverride: ""

image:
  repository: ai-containers-cn-beijing.cr.volces.com/physicalai/lerobot-agent-console
  # REQUIRED, and deliberately empty: the chart does not track the image. The pipeline tags every
  # build with its commit sha (there is no `latest`), so a hardcoded tag here means republishing
  # the chart for every build — the chart version and the image version are not the same thing
  # and should not be tied together.
  #
  # Pass it at deploy time: `--set image.tag=<sha>`, or edit this line in the values box on the
  # VKE console's Helm page. Find the sha in the CP pipeline's build record, or list them:
  #   oras repo tags ai-containers-cn-beijing.cr.volces.com/physicalai/lerobot-agent-console
  # ⚠️ Verify the tag exists before deploying — a sha that was never built gives
  # ImagePullBackOff, and if you have just deleted the PVC there is nothing to roll back to.
  tag: ""
  pullPolicy: IfNotPresent

# Empty on purpose. The GPU request below is what schedules this pod, so pinning a node is never
# required — and a hostname from one cluster leaves the pod Pending forever on any other. Fill it
# only to force a specific machine: nodeSelector: { kubernetes.io/hostname: "192.168.1.2" }
# ⚠️ Worth doing once a PVC exists: ebs-* volumes are ZONAL, so a pod rescheduled to another
# zone can never attach the disk it already has.
nodeSelector: {}

resources:
  requests: { cpu: "16", memory: 128Gi, nvidia.com/gpu: "1" }
  limits:   { cpu: "16", memory: 128Gi, nvidia.com/gpu: "1" }

# RDMA pins (mlocks) memory; the container default `ulimit -l` is 64 KB with an equal hard
# limit, so NCCL picks the RoCE NIC and then fails to allocate. CAP_IPC_LOCK is the k8s fix.
capabilities: ["IPC_LOCK"]

persistence:
  storageClass: ebs-essd
  # The REAL size: both bound PVCs are 1Ti (spec and status), resized by editing the PVCs
  # directly. The live StatefulSet templates still say 128Gi, because editing a PVC does not —
  # and cannot — update the template it came from.
  # ⚠️ volumeClaimTemplates is IMMUTABLE, so a plain `helm upgrade` against those StatefulSets
  # is REJECTED while this differs from 128Gi. Adopting them needs a one-time
  # `kubectl delete sts --cascade=orphan` (keeps pods and PVCs) before the first install —
  # see charts/README.md. A fresh install gets 1Ti directly and needs none of that.
  size: 1Ti

# /dev/shm for the PyTorch DataLoader. The 64Mi container default overflows ("Bus error" /
# "out of shared memory") and the container cannot remount it without CAP_SYS_ADMIN.
dshmSize: 32Gi

# Console login (HTTP basic auth), supplied only through a Secret you create beforehand.
#
# The chart deliberately cannot build one from values: Helm stores values verbatim in the release
# history, so a password passed that way stays readable to anyone who can run `helm get values` —
# and it stays there for every past revision, so rotating it does not remove the old one. This
# console hands out a root shell on a GPU node, which makes that the wrong trade.
#
# Create it first — the VKE console has a 密钥 (Secret) page, no shell required:
#   kubectl create secret generic <secret-name> -n <namespace> \
#     --from-literal=username=<user> --from-literal=password=<password>
#
# The Secret must live in the SAME namespace as the release — Kubernetes does not let a pod
# reference a Secret from another one.
#
# Key names match the command above and RLinf's chart; leave them alone unless you are adopting
# a Secret that already exists with different ones, which the two keys below let you do without
# rebuilding it around a live password.
auth:
  existingSecret: ""        # REQUIRED — the chart refuses to render without it
  usernameKey: username
  passwordKey: password

# async_inference 的 policy_server: a gRPC port on the Service, and — when APIG is on — a route
# to it. OFF by default, and that is a security decision rather than a conservative one.
#
# The console itself sits behind HTTP basic auth (server.py refuses to start without credentials).
# policy_server does not: it calls add_insecure_port() and checks nothing — no token, no TLS, no
# peer identity. A route to it on the gateway therefore does not sit behind the console's login;
# it is an unauthenticated endpoint on a public domain that will happily run inference on a GPU
# for whoever finds it. Turn it on for a validation session, turn it off after.
#
# Plaintext is not a choice either: robot_client uses grpc.insecure_channel and policy_server
# add_insecure_port, so BOTH ends are h2c-only. Clients must use APIG's http:// domain — the
# https:// one fails at the TLS handshake.
#
# pathPrefix is the gRPC service's fully-qualified name, from src/lerobot/transport/services.proto:
# `package transport` + `service AsyncInference` -> /transport.AsyncInference. gRPC puts
# /<package>.<Service>/<Method> in the HTTP/2 path, so this prefix matches every method on it.
inference:
  enabled: false
  port: 18980
  pathPrefix: /transport.AsyncInference

env:
  # An ORDERED LIST, not a map: Helm's `range` sorts map keys, and reordering container env
  # changes the pod-template hash — which would restart both consoles on the first upgrade for
  # no reason. Keep this in the same order as the running StatefulSets.
  - { name: PORT, value: "8080" }
  - { name: CONSOLE_WORKDIR, value: /lerobot }        # the lerobot checkout in the image
  - { name: CONSOLE_SHELL, value: /bin/bash }
  # lerobot 0.6.x hard-errors if LEROBOT_HOME is set at all; HF_LEROBOT_HOME is the right var,
  # and it must point at the writable PVC (the image default is unreadable as root).
  - { name: HF_LEROBOT_HOME, value: /opt/data/.cache/huggingface/lerobot }
  - { name: HOME, value: /opt/data }                  # image default is 700, owned by another user
  - { name: HERMES_CHAT_SKILL, value: robot_sft }
  - { name: HERMES_HOME, value: /opt/data }

# Public HTTPS entry point through Volcengine APIG. OFF by default so a first install succeeds
# on any cluster; the console is reachable in-cluster either way. Turn it on once you know which
# gateway it should use.
#
# ⚠️ Turning this on puts a root shell on a GPU node behind a public address. The address is not
#    a secret — the platform issues it and lists it in the APIG console — so the credentials in
#    auth.existingSecret are the only thing between it and the internet.
#
# Field names and meanings are identical to the RLinf chart, deliberately: one story across both
# products. Change them together.
apig:
  enabled: false

  # Two ways to get a gateway, matching the APIGInstance CRD's own two modes:
  #   create: false -> ADOPT an existing gateway. Put its instance id, from the APIG console, in
  #                    existingId; the Ingress binds to it by id. ingressClassName MUST match the
  #                    class that gateway declares or it will never claim the Ingress.
  #   create: true  -> PROVISION a new one (CRD sets spec.name + spec.common). subnetIds is then
  #                    REQUIRED and must be in this cluster's VPC. Takes a few minutes, and bills.
  #
  # Either way this is a SINGLE step. With create=true the provisioned gateway claims the Ingress
  # from its own side — the APIGInstance watches this namespace and this ingress class — so its
  # id never has to come back into values. An earlier version of this chart did make you read
  # status.id and upgrade a second time; that is gone.
  #
  # ⚠️ With create=true, leave existingId EMPTY and keep it empty. Writing it sets spec.id, which
  #    the CRD treats as immutable: the admission webhook then rejects every later upgrade with
  #      spec.id: Forbidden: forbidden to update, old: , new: <id>
  #    and the release stays failed until the value is removed again. The chart refuses to render
  #    that combination rather than let you find out at apply time.
  # ⚠️ A gateway this chart provisioned is DELETED by `helm uninstall`, taking its auto-assigned
  #    *.volceapi.com domain with it — a new one comes back under a different name. Adopt an
  #    existing gateway for anything whose URL people have bookmarked, or set retainOnDelete.
  create: false
  # create=true only: keep the provisioned gateway when the release is uninstalled, instead of
  # deleting it along with its *.volceapi.com domain. Turn it on BEFORE you need it — Helm decides
  # what to retain from the manifest recorded in the release, so annotating the live object after
  # the fact has no effect and the gateway still goes.
  retainOnDelete: false
  existingId: ""                  # create=false: REQUIRED, the gateway's instance id
  instanceName: ""                # create=true: gateway name (default: <release>-apig)
  subnetIds: []                   # create=true: REQUIRED

  # Gateway sizing. ALL OPTIONAL, and empty means "let the platform choose" — which is the right
  # default and how our own test gateway was actually created. (The values that appear in
  # `kubectl get apiginstance -o yaml` afterwards are the platform's answer, not our input; an
  # earlier version of this chart copied them back in as if they were settings. Pinning them
  # freezes you on spec codes that the platform is free to retire, and `replicas` is billed.)
  # Fill in only what you deliberately want to control.
  replicas: ""                    # gateway replicas — more than one is HA, and costs it
  instanceSpecCode: ""            # e.g. 1c2g
  clbSpecCode: ""                 # e.g. small_1
  publicNetworkBillingType: ""    # e.g. traffic
  publicNetworkBandwidth: ""      # Mbps, e.g. 200 — the gateway proxies UI traffic only

  ingressName: ""                 # default: <release>-apig

  # One gateway per ingress class: pointing two consoles at the same class routes them to one
  # gateway. Default is <release>-apig, which is unique as long as release names are.
  # ⚠️ create=false: this must be the class the ADOPTED gateway declares, not the default. There
  #    is no default that could be right, so the chart requires it.
  ingressClassName: ""
  # Internal placeholder host, never public DNS — it is only the key APIG routes on, and each
  # distinct host is what earns its own managed *.volceapi.com domain. Must not collide with a
  # host already registered on the same gateway.
  # ⚠️ Never put the auto-assigned *.volceapi.com name here — doing that once killed the 443
  #    listener outright (503 -> 000).
  host: ""                        # default: <release>.apig.local
  annotations: {}                 # binding annotations are added automatically from existingId

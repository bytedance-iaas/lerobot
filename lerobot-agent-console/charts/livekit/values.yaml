nameOverride: ""

image:
  repository: docker.m.daocloud.io/livekit/livekit-server   # daocloud mirror (CN)
  # Pin a version. `latest` means a restart can silently move a PUBLIC SFU to a new server
  # build — including across a breaking change — at a moment nobody chose. This is the version
  # the running deployment resolved `latest` to, so pinning it changes nothing today.
  tag: v1.13.5
  pullPolicy: IfNotPresent

# The ICE candidate address clients are told to connect to. It must be the CLB's PUBLIC IP, not
# a pod or node IP, or signalling succeeds and media never establishes.
#
# Leave it empty: an init container waits for this chart's own CLB to be assigned an IP and hands
# it to the server. (Requiring it as input was circular — the chart creates that CLB, so the IP
# does not exist until after the first install.) Setting it explicitly skips the wait and drops
# the init container's ServiceAccount/Role along with it:
#   kubectl get svc <release>-clb -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
nodeIp: ""

# LiveKit API credentials, supplied only through a Secret you create beforehand.
#
# Same reasoning as the console: Helm keeps values verbatim in the release history, so a key
# passed through values is readable by anyone who can run `helm get values`, on every revision
# that ever held it. This key signs access tokens for an SFU on a public CLB — whoever has it can
# mint a token for any room.
#
# Create it first — the VKE console has a 密钥 (Secret) page, no shell required. The value is
# LiveKit's own `keys` map, one `api_key: api_secret` pair per line:
#
#   kubectl create secret generic livekit-auth -n <namespace> --from-literal=keys='devkey: <secret>'
#     where <secret> is e.g. `openssl rand -hex 32`
#
# ⚠️ Use a DEDICATED key here, not one shared with anything else: it has to be handed to every
# client that publishes or subscribes, so it travels further than a server-side password does.
#
# The same Secret must be readable by both ends — the server (this chart) and whatever publishes
# to it — or they authenticate against different keys and every connection fails.
auth:
  existingSecret: ""        # REQUIRED — the chart refuses to render without it
  keysKey: keys

service:
  # REQUIRED, and specific to your cluster: the CLB is created from this subnet, which must be
  # in the cluster's VPC. The value below is an example from one account — it will not exist in
  # yours, and the CLB then never gets an IP (the init container waits, then fails with that
  # hint). Find it in the VPC console, or from an existing Service's annotations.
  #
  # ⚠️ Once a CLB exists, changing this provisions a NEW load balancer with a NEW public IP and
  # invalidates every client's --livekit-url. Treat it as immutable after the first install.
  subnetId: ""
  addressType: internet

  # Whether `helm uninstall` leaves the CLB behind (helm.sh/resource-policy: keep).
  #
  # true for anything real: the CLB holds a PUBLIC IP that every client has baked into its
  # --livekit-url, it outlives any single release, and deleting it does not give the address
  # back — a new one comes with a new IP and every robot pointing at the old one is broken.
  # false for throwaway installs, where the leftover is a billed resource and an EIP out of
  # quota that someone has to remember to delete by hand.
  keepOnUninstall: true
  ports:
    signal: 7880    # WS signaling
    rtcTcp: 7881    # WebRTC over TCP (fallback)
    rtcUdp: 7882    # WebRTC media (primary)

resources:
  requests: { cpu: 200m, memory: 256Mi }
  limits:   { cpu: "1",  memory: 1Gi }

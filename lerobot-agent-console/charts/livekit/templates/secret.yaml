{{- $name := default .Release.Name .Values.nameOverride -}}
{{/* LiveKit API credentials. Always created by the chart: the install path is the VKE console's
     Helm page, which has no shell, so "make this Secret first" is not a thing anyone can do. */}}
{{- if not .Values.auth.keys }}
{{- fail "livekit: auth.keys is empty. Set it to LiveKit's `keys` map — one `api_key: api_secret` pair per line, e.g.\n  auth:\n    keys: |\n      devkey: <openssl rand -hex 32>\nThis SFU is published on a CLB, so it must not start with an absent or guessable key." }}
{{- end }}
{{- if not .Values.service.subnetId }}
{{- fail "livekit: service.subnetId is required — the CLB is created from it and it must be a subnet in this cluster's VPC. Without a valid one the load balancer never gets a public IP and media never connects." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-auth
  labels: { app: {{ $name }} }
type: Opaque
stringData:
  keys: |
    {{- .Values.auth.keys | nindent 4 }}
